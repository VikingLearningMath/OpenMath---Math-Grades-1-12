<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viking</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/index.css" />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/proxy.css" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..40,100..1000&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..400,0..1"
  />
</head>
<body>
  <ul class="navbar">
    <li style="margin-left: -1px; margin-top: 2px">
      <a href="/"><img class="logo" src="/assets/logo.webp" alt="Logo" /></a>
    </li>
    <hr style="margin-top: 5px" />
    <li>
      <a href="/"><span class="material-symbols-outlined">cottage</span></a>
    </li>
    <hr />
    <li>
      <a href="/math" title="Openmathlearning"><span class="material-symbols-outlined">functions</span></a>
    </li>
    <hr />
    <li>
      <a href="/settings"><span style="margin-top: 0" class="material-symbols-outlined">tune</span></a>
    </li>
  </ul>

  <!-- Utility bar shown above content / iframe -->
  <div class="utilityBar" id="utilityBar">
    <ul class="utility">
      <li><div class="utilityIcon" id="backBtn"><span class="material-symbols-outlined">arrow_back</span></div></li>
      <li><div class="utilityIcon" id="refreshBtn"><span class="material-symbols-outlined">refresh</span></div></li>
      <li><div class="utilityIcon" id="forwardBtn"><span class="material-symbols-outlined">arrow_forward</span></div></li>
      <hr style="min-width: 1px" />
      <div class="search-header" style="flex-grow: 1; margin-left: 8px; margin-right: 8px">
        <input id="addr" placeholder="Enter URL or search…" class="search-header__input" type="text" />
      </div>
      <hr style="margin-left: 43px; min-width: 1px" />
      <li><div class="utilityIcon" id="homeBtn"><span class="material-symbols-outlined">cottage</span></div></li>
      <li><div class="utilityIcon" id="fullscreenBtn"><span class="material-symbols-outlined">fullscreen</span></div></li>
    </ul>
  </div>

  <!-- Initial search header (centered) -->
  <div class="header" id="centerSearch">
    <h1>Say Hello To <span class="typewrite" data-period="2000" data-type='[ "Viking.","adventure.","exploration.","power.","the open web.","valhalla.","freedom.","speed.","the seven seas.","your gateway.","aesthetic.","privacy."]'><span class="wrap"></span></span></h1>
    <form id="formintospace" class="search-header" style="animation: fade-in-top 1s;">
      <input
        id="gointospace"
        placeholder=""
        class="search-header__input"
        type="text"
      />
      <button aria-label="search" type="submit" class="search-header__button gointospaceSearchButton">
        <span class="go-arrow">&#8594;</span>
      </button>
    </form>
  </div>

  <!-- Search results pane (hidden until needed) -->
  <div id="resultsPane" style="display:none; padding: 90px 60px 40px 110px;">
    <h2 style="color:#fff;margin-bottom:18px;">Results</h2>
    <div id="results"></div>
  </div>

  <!-- Iframe for proxied site -->
  <iframe id="intospace" style="display:none;width:calc(100vw - 50px);position:absolute;border:none;outline:0;right:0;z-index:9999999;background-color:#252525;bottom:0;"></iframe>

  <!-- Spinner overlay -->
  <div class="spinnerParent" id="spinner" style="display:none;z-index:999999;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);">
    <div class="spinner" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
  </div>

  <!-- Background vignette (checkerboard pattern is painted on the body) -->
  <div id="grid-overlay" aria-hidden="true"></div>

  <script src="/js/proxy.js"></script>
  <!-- Shared typewriter effect -->
  <script src="/js/typewriter.js"></script>
</body>
</html>
