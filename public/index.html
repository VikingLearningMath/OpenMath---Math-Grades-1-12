<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viking</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="stylesheet" href="/css/index.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..40,100..1000&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..400,0..1" />
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>
  <ul class="navbar">
    <li style="margin-left: -1px; margin-top: 2px">
      <a href="/"><img class="logo" src="/assets/logo.webp" alt="Viking" /></a>
    </li>
    <hr style="margin-top: 5px" />
    <li>
      <a href="/" id="navactive"><span class="material-symbols-outlined">cottage</span></a>
    </li>
    <hr />
    <li>
      <a href="/math" id="navmath" title="Openmathlearning"><span class="material-symbols-outlined">functions</span></a>
    </li>
    <hr />
    <li>
      <a href="/settings"><span style="margin-top: 0" class="material-symbols-outlined">tune</span></a>
    </li>
  </ul>

  <div class="blob"></div>
  <div class="blobbig"></div>
  <div class="blobsmall"></div>
  <div class="blobtop"></div>
  <canvas id="lava-bg" aria-hidden="true"></canvas>

  <div class="header">
    <h1 style="font-size: clamp(34px, 7vw, 72px)">
      Welcome to
      <span style="cursor: text">
        <span
          class="typewrite"
          data-period="2000"
          data-type='[ "Viking.","adventure.","exploration.", "power.","the open web.","valhalla.","freedom.","speed.","the seven seas.","your gateway.","aesthetic.","privacy."]'
        >
          <span class="wrap"></span>
        </span>
      </span>
    </h1>
    <p>Search, browse, and explore.</p>

    <form id="home-search" autocomplete="off">
      <input
        id="home-input"
        type="text"
        placeholder="Search or enter a URL…"
        aria-label="Search or enter URL"
      />
    </form>
  </div>

  <script>
    // Typewriter effect (classic open-source snippet)
    var TxtType = function(el, toRotate, period) {
      this.toRotate = toRotate;
      this.el = el;
      this.loopNum = 0;
      this.period = parseInt(period, 10) || 2000;
      this.txt = '';
      this.tick();
      this.isDeleting = false;
    };
    TxtType.prototype.tick = function() {
      var i = this.loopNum % this.toRotate.length;
      var fullTxt = this.toRotate[i];
      if (this.isDeleting) {
        this.txt = fullTxt.substring(0, this.txt.length - 1);
      } else {
        this.txt = fullTxt.substring(0, this.txt.length + 1);
      }
      this.el.innerHTML = '<span class="wrap">' + this.txt + '</span>';
      var that = this;
      var delta = 200 - Math.random() * 100;
      if (this.isDeleting) { delta /= 2; }
      if (!this.isDeleting && this.txt === fullTxt) {
        delta = this.period;
        this.isDeleting = true;
      } else if (this.isDeleting && this.txt === '') {
        this.isDeleting = false;
        this.loopNum++;
        delta = 500;
      }
      setTimeout(function() { that.tick(); }, delta);
    };
    var elements = document.getElementsByClassName('typewrite');
    for (var i = 0; i < elements.length; i++) {
      var toRotate = elements[i].getAttribute('data-type');
      var period = elements[i].getAttribute('data-period');
      if (toRotate) {
        new TxtType(elements[i], JSON.parse(toRotate), period);
      }
    }

    // Search: navigate into the proxy, which fetches via an open-source CORS proxy.
    document.getElementById('home-search').addEventListener('submit', function(e) {
      e.preventDefault();
      var q = document.getElementById('home-input').value.trim();
      if (q) location.href = '/proxy?q=' + encodeURIComponent(q);
    });

    // Lava mouse-effect background (replaces particle stars).
    // Self-contained canvas: warm blobs slowly flow, drift toward the cursor,
    // and a heat-glow follows the mouse like bubbling lava.
    (function () {
      var canvas = document.getElementById('lava-bg');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * DPR; canvas.height = H * DPR;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // Mouse target (smoothed)
      var mx = W / 2, my = H / 2, smx = W / 2, smy = H / 2;
      window.addEventListener('mousemove', function (e) {
        mx = e.clientX; my = e.clientY;
      });
      window.addEventListener('touchmove', function (e) {
        var t = e.touches && e.touches[0];
        if (t) { mx = t.clientX; my = t.clientY; }
      }, { passive: true });

      // Lava blobs: warm palette, drifting + wobbling, attracted to cursor.
      var PALETTE = ['#5a1200', '#8a1f0a', '#c2410c', '#ea580c', '#f0820d', '#f7ab0e', '#ffd54a'];
      var blobs = [];
      var COUNT = 14;
      for (var i = 0; i < COUNT; i++) {
        blobs.push(makeBlob(true));
      }
      function rand(a, b) { return a + Math.random() * (b - a); }
      function makeBlob(anywhere) {
        return {
          x: anywhere ? rand(0, W) : rand(-100, W + 100),
          y: anywhere ? rand(0, H) : rand(-100, H + 100),
          r: rand(40, 150),
          hue: PALETTE[(Math.random() * PALETTE.length) | 0],
          vx: rand(-0.25, 0.25),
          vy: rand(-0.25, 0.25),
          phase: rand(0, Math.PI * 2),
          speed: rand(0.008, 0.02)
        };
      }

      var raf = null;
      function frame(t) {
        smx += (mx - smx) * 0.04;
        smy += (my - smy) * 0.04;
        ctx.clearRect(0, 0, W, H);
        var k = t / 1000;

        // Base dark fill with a faint warm vignette.
        ctx.fillStyle = 'rgba(0,0,0,0)'; // transparent — page bg shows through

        for (var i = 0; i < blobs.length; i++) {
          var b = blobs[i];
          // Gentle autonomous drift + sinusoidal wobble.
          b.x += b.vx + Math.sin(k * b.speed * 60 + b.phase) * 0.15;
          b.y += b.vy + Math.cos(k * b.speed * 60 + b.phase) * 0.15;
          // Attract toward cursor so it "bubbles" and churns under the pointer.
          var dx = smx - b.x, dy = smy - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 600) {
            var pull = (1 - dist / 600) * 0.5;
            b.x += (dx / dist) * pull;
            b.y += (dy / dist) * pull;
          }
          // Wrap around edges.
          if (b.x < -b.r) b.x = W + b.r; else if (b.x > W + b.r) b.x = -b.r;
          if (b.y < -b.r) b.y = H + b.r; else if (b.y > H + b.r) b.y = -b.r;

          var grd = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          grd.addColorStop(0, b.hue);
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = 0.5 + 0.3 * Math.sin(k * b.speed * 40 + b.phase);
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Cursor heat-glow: a bright lava patch that follows the mouse.
        var g = ctx.createRadialGradient(smx, smy, 0, smx, smy, 160);
        g.addColorStop(0, 'rgba(255,200,50,0.35)');
        g.addColorStop(0.4, 'rgba(255,120,20,0.18)');
        g.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(smx, smy, 160, 0, Math.PI * 2);
        ctx.fill();

        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
